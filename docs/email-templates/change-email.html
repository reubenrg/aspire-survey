<!-- Supabase Auth Template: Change Email -->
<!-- Subject line (set separately in the Supabase dashboard field): Confirm your new Aspire email address -->
<div style="background-color:#f4f5f7;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background-color:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e5e7eb;">
    <tr>
      <td style="padding:32px 32px 24px 32px;text-align:center;border-bottom:1px solid #f0f1f3;">
        <span style="font-size:20px;font-weight:700;color:#1f2937;letter-spacing:-0.01em;">Aspire</span>
      </td>
    </tr>
    <tr>
      <td style="padding:32px;">
        <h1 style="margin:0 0 16px 0;font-size:18px;font-weight:600;color:#1f2937;">Confirm your new Aspire email address</h1>
        <p style="margin:0 0 24px 0;font-size:14px;line-height:1.6;color:#4b5563;">
          Confirm this email address to finish updating the sign-in email on your Aspire account.
        </p>
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px 0;">
          <tr>
            <td style="border-radius:6px;background-color:#2961B6;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 28px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:6px;">Confirm email address</a>
            </td>
          </tr>
        </table>
        <p style="margin:0;font-size:13px;line-height:1.6;color:#6b7280;">
          If you didn't request this change, you can safely ignore this email — your account's sign-in email will not be updated.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 32px;background-color:#f9fafb;text-align:center;border-top:1px solid #f0f1f3;">
        <p style="margin:0;font-size:12px;color:#9ca3af;">Aspire · SPI Group</p>
      </td>
    </tr>
  </table>
</div>
