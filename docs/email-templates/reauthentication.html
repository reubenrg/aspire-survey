<!-- Supabase Auth Template: Reauthentication -->
<!-- Subject line (set separately in the Supabase dashboard field): Your Aspire verification code -->
<div style="background-color:#f4f5f7;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background-color:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e5e7eb;">
    <tr>
      <td style="padding:32px 32px 24px 32px;text-align:center;border-bottom:1px solid #f0f1f3;">
        <span style="font-size:20px;font-weight:700;color:#1f2937;letter-spacing:-0.01em;">Aspire</span>
      </td>
    </tr>
    <tr>
      <td style="padding:32px;">
        <h1 style="margin:0 0 16px 0;font-size:18px;font-weight:600;color:#1f2937;">Your Aspire verification code</h1>
        <p style="margin:0 0 24px 0;font-size:14px;line-height:1.6;color:#4b5563;">
          Enter this code to confirm it's you. This code expires shortly and can only be used once.
        </p>
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px 0;width:100%;">
          <tr>
            <td style="text-align:center;padding:16px;background-color:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;">
              <span style="font-size:28px;font-weight:700;letter-spacing:0.15em;color:#1f2937;font-family:'SF Mono',Consolas,Menlo,monospace;">{{ .Token }}</span>
            </td>
          </tr>
        </table>
        <p style="margin:0;font-size:13px;line-height:1.6;color:#6b7280;">
          If you didn't request this code, you can safely ignore this email.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 32px;background-color:#f9fafb;text-align:center;border-top:1px solid #f0f1f3;">
        <p style="margin:0;font-size:12px;color:#9ca3af;">Aspire · SPI Group</p>
      </td>
    </tr>
  </table>
</div>
